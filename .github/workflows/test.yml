name: Test tap

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Tap checkout
        run: brew tap digitable-lol/tap "$GITHUB_WORKSPACE"
      - name: Audit formula
        run: brew audit --strict digitable-lol/tap/digit
      - name: Install from source
        run: brew install --build-from-source digitable-lol/tap/digit
      - name: Test installation
        run: brew test digit
